services:
  - type: web
    name: autotradingbot
    runtime: docker
    plan: free
    region: virginia
    healthCheckPath: /health
    envVars:
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_API_SECRET
        sync: false
      - key: ALPACA_BASE_URL
        value: https://paper-api.alpaca.markets
      - key: GEMINI_API_KEY
        sync: false
      - key: TRACK_START_DATE
        value: "2026-10-13"
