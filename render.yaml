services:
  - type: web
    name: autotradingbot
    runtime: docker
    plan: free
    region: virginia
    healthCheckPath: /health
    envVars:
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_API_SECRET
        sync: false
      - key: ALPACA_BASE_URL
        value: https://paper-api.alpaca.markets
      - key: GEMINI_API_KEY
        sync: false
      - key: TRACK_START_DATE
        value: "2026-10-13"
      # Optional: a custom domain allowed to read /stats/history from a browser.
      - key: CORS_EXTRA_ORIGIN
        sync: false
      # gradual (default) | advisory | off. Advisory only LOGS the rebalancing it would
      # do and enforces nothing: leave it on advisory and the policy bands are never met.
      - key: IPS_BANDS_MODE
        value: gradual
